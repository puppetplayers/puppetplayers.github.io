<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | The Puppet Players</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="48x48" href="/media/favicon-48.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Raleway:wght@400;500&family=Josefin+Sans:wght@600&display=swap" rel="stylesheet">
  <style>
    :root{--white:#FDF4E3;--tan:#FAE3B1;--blue:#064567;--amber:#DE973A;--brown:#311915;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;background-color:var(--blue);background-image:radial-gradient(circle,rgba(255,255,255,0.18) 1.5px,transparent 1.5px),radial-gradient(circle,rgba(255,255,255,0.18) 1.5px,transparent 1.5px);background-size:20px 20px;background-position:0 0,10px 10px;font-family:'Raleway',sans-serif;color:var(--white);text-align:center;padding:24px;}
    .card{max-width:520px;}
    h1{font-family:'Rozha One',serif;font-size:clamp(4rem,12vw,7rem);line-height:1;color:var(--tan);}
    h2{font-family:'Rozha One',serif;font-size:clamp(1.4rem,4vw,2rem);margin:12px 0 16px;}
    p{opacity:0.85;margin-bottom:32px;line-height:1.6;}
    .btn{display:inline-block;padding:14px 32px;border-radius:6px;font-family:'Josefin Sans',sans-serif;font-size:14px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;text-decoration:none;background-color:var(--amber);color:var(--brown);transition:background 0.2s ease;}
    .btn:hover{background-color:#c97d28;}
    .home-link{display:block;margin-top:20px;color:var(--tan);font-size:0.85rem;}
  </style>
</head>
<body>
  <div class="card">
    <h1>404</h1>
    <h2>This puppet has gone missing.</h2>
    <p>The page you're looking for isn't behind this curtain. It may have been moved, renamed, or never existed in the first place.</p>
    <a class="btn" href="/">Back to the Show</a>
    <a class="home-link" href="/#contact">Or request a show — we'll bring the stage to you.</a>
  </div>
</body>
</html>
